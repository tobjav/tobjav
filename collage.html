<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ig carousel creator</title>
    <style>
        @font-face {
            font-family: 'DM';
            src: url('DMSans-VariableFont_opsz,wght.ttf') format('woff2');
        }
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: DM, sans-serif;
            font-size: larger;
            font-weight: bold;
            overflow: hidden;
        }

        a { color: #FABD2F; font-weight: bold; font-family: DM, sans-serif; }
        
        #shiftadvice {
            display: inline-flex;
            transform: translateX(10%);
        }

        /* ── TOOLBAR ── */
        #toolbar {
            height: 56px;
            background: #000;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            border-bottom: 1px solid #222;
            position: relative;
            z-index: 20;
        }
        #toolbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: DM, sans-serif;
            font-size: 14px;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        button:active { opacity: 0.75; }
        #export-btn { background: #FABD2F; color: #111; }
        #file-input { display: none; }

        /* ── WORKSPACE ── */
        #workspace-container {
            position: absolute;
            top: 56px;
            left: 0; right: 0; bottom: 0;
            overflow: scroll;
            -webkit-overflow-scrolling: touch;
            background: #111;
        }

        /* ── CANVAS TRACK: all sizing done in JS with real pixel values ── */
        #canvas-track {
            position: relative;
            background: #fff;
        }

        /* ── SEAMS ── */
        .slide-seam {
            position: absolute;
            pointer-events: none;
        }
        .slide-label {
            position: absolute;
            color: #888;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
        }

        /* ── IMAGE WRAPPERS ──
           Default: allow pan in both axes (browser handles scroll).
           .is-dragging: none (JS has taken over via pointer capture).        */
        .image-wrapper {
            position: absolute;
            box-sizing: border-box;
            touch-action: pan-x pan-y;
        }
        .image-wrapper.active     { outline: 2px solid #FABD2F; }
        .image-wrapper.is-dragging { touch-action: none; }

        .delete-btn {
            display: none;
            position: absolute;
            top: -14px; right: -14px;
            width: 28px; height: 28px;
            background: #FF3B30;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 26px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .image-wrapper.active .delete-btn { display: block; }

        .resize-handle {
            display: none;
            position: absolute;
            bottom: -8px; right: -8px;
            width: 22px; height: 22px;
            background: #FABD2F;
            border: 2px solid #fff;
            border-radius: 3px;
            cursor: nwse-resize;
            z-index: 10;
            touch-action: none;
        }
        .image-wrapper.active .resize-handle { display: block; }

        /* ── DROP OVERLAY ── */
        #drop-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,122,255,0.2);
            z-index: 50;
            pointer-events: none;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        /* ── SPLASH ── */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .splash-content { display:flex; flex-direction:column; align-items:center; gap:20px; }
        .splash-logo {
            font-size: clamp(32px, 12vw, 72px);
            font-weight: bold;
            letter-spacing: 0px;
            font-family: DM;
        }
        .progress-track {
            width:180px; height:4px;
            background:rgba(255,255,255,0.1);
            border-radius:2px; overflow:hidden;
        }
        .progress-bar {
            height:100%; width:0%;
            background:#FABD2F;
            animation: fakeLoad 0.8s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        @keyframes fakeLoad {
            0%{width:0%} 15%{width:0%} 30%{width:50%} 80%{width:50%} 100%{width:100%}
        }
        #splash-screen.fade-away { opacity:0; pointer-events:none; }

        /* ── SLIDE NAV (portrait only) ── */
        #slide-nav {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 56px;
            background: #000;
            border-top: 1px solid #222;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 30;
        }
        #slide-nav button {
            font-size: 22px;
            padding: 6px 20px;
            background: #222;
            border-radius: 8px;
        }
        #nav-label {
            font-size: 13px;
            color: #aaa;
            font-weight: bold;
        }
        /* In portrait: lock workspace scroll, shrink bottom to make room for nav */
        body.portrait-mode #workspace-container {
            bottom: 56px;
            overflow: hidden;
            touch-action: none;
        }

        /* ── PORTRAIT UI SCALING ─────────────────────────────────────────────
           Calibrated for ~754px portrait width (e.g. 1344px landscape device).
           All values only apply in portrait — desktop landscape unchanged.   */
        @media (orientation: portrait) {

            #toolbar {
                height: 11vw;
                padding: 0 4vw;
                gap: 3vw;
            }

            #workspace-container {
                top: 11vw;
            }

            #toolbar span, #toolbar a {
                font-size: 4vw;
            }

            #toolbar button {
                font-size: 4vw;
                padding: 2vw 4vw;
                border-radius: 1.5vw;
            }

            #shiftadvice {
                display: none;
            }

            .delete-btn {
                width:  9vw;
                height: 9vw;
                top:   -4.5vw;
                right: -4.5vw;
                line-height: 8.6vw;
                font-size: 5vw;
            }

            .resize-handle {
                width:  7vw;
                height: 7vw;
                bottom: -3.5vw;
                right:  -3.5vw;
            }

            #slide-nav {
                height: 13vw;
                padding: 0 5vw;
            }

            #slide-nav button {
                font-size: 7vw;
                padding: 2vw 6vw;
                border-radius: 2vw;
                min-width: 18vw;
                min-height: 9vw;
            }

            #nav-label {
                font-size: 4vw;
            }

            body.portrait-mode #workspace-container {
                bottom: 13vw;
            }
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div id="splash-screen">
    <div class="splash-content">
        <div class="splash-logo">tobjav</div>
        <div class="progress-track"><div class="progress-bar"></div></div>
    </div>
</div>

<div id="toolbar">
    <a style="text-decoration:underline;" href="index.html">tobjav's</a>
    <span>ig collage maker  <div id="shiftadvice">[shift+scroll to pan]</div></span>
    <div id="toolbar-right">
        <button id="add-file-btn">＋ Add</button>
        <input type="file" id="file-input" accept="image/*" multiple>
        <button id="export-btn">Export</button>
    </div>
</div>

<div id="workspace-container">
    <div id="drop-overlay">drop to import</div>
    <div id="canvas-track"></div>
</div>

<div id="slide-nav">
    <button id="nav-prev">&#8592;</button>
    <span id="nav-label">Slide 1 / 20</span>
    <button id="nav-next">&#8594;</button>
</div>

<canvas id="export-canvas" style="display:none;"></canvas>

<script>
'use strict';

// ── Splash ────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
    const splash = document.getElementById('splash-screen');
    setTimeout(() => {
        splash.classList.add('fade-away');
        setTimeout(() => splash.remove(), 500);
    }, 800);
});

// ── DOM refs ──────────────────────────────────────────────────────────────────
const canvasTrack  = document.getElementById('canvas-track');
const exportCanvas = document.getElementById('export-canvas');
const exportBtn    = document.getElementById('export-btn');
const addFileBtn   = document.getElementById('add-file-btn');
const fileInput    = document.getElementById('file-input');
const workspace    = document.getElementById('workspace-container');
const dropOverlay  = document.getElementById('drop-overlay');

const TOTAL_SLIDES   = 20;
const SNAP_THRESHOLD = 15;
const MARGIN         = 32;  // px around the canvas track
const DRAG_THRESHOLD = 6;   // px of movement before committing to a drag

// Layout state — set by applyLayout(), read everywhere else
let SLIDE_W, SLIDE_H, isPortrait;

// ── Layout ────────────────────────────────────────────────────────────────────
// All sizing uses real pixel values from window.innerWidth/Height.
// We deliberately avoid reading CSS custom properties because CSS calc()
// strings like "calc(100vw - 32px)" cannot be parsed by parseFloat(),
// which would silently produce NaN and an invisible canvas.
function applyLayout() {
    isPortrait = window.innerHeight > window.innerWidth;

    if (isPortrait) {
        // Keep horizontal layout — seams stay vertical (on long edges of each slide).
        // Shrink slide width to fit phone screen so one slide fills the viewport.
        SLIDE_W = window.innerWidth - MARGIN * 2;
        SLIDE_H = Math.round(SLIDE_W * 1.25);   // 4:5 portrait IG ratio

        canvasTrack.style.width  = (SLIDE_W * TOTAL_SLIDES) + 'px';
        canvasTrack.style.height = SLIDE_H + 'px';
        canvasTrack.style.margin = MARGIN + 'px ' + MARGIN + 'px';
        canvasTrack.style.boxShadow = '0 6px 20px rgba(0,0,0,0.5)';
    } else {
        SLIDE_W = 500;
        SLIDE_H = 600;

        canvasTrack.style.width  = (SLIDE_W * TOTAL_SLIDES) + 'px';
        canvasTrack.style.height = SLIDE_H + 'px';
        canvasTrack.style.margin = '40px 50px';
        canvasTrack.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
    }

    rebuildSeams();
}

function rebuildSeams() {
    canvasTrack.querySelectorAll('.slide-seam').forEach(s => s.remove());

    for (let i = 0; i < TOTAL_SLIDES; i++) {
        const seam  = document.createElement('div');
        seam.className = 'slide-seam';

        const label = document.createElement('span');
        label.className = 'slide-label';
        label.innerText = 'Slide ' + (i + 1);

        if (isPortrait) {
            seam.style.cssText  = 'left:' + (i * SLIDE_W) + 'px;top:0;width:0;height:100%;border-left:2px dashed rgba(20,20,20,0.2);';
            label.style.cssText = 'top:' + (SLIDE_H + 10) + 'px;left:' + (i + SLIDE_W / 2 - 22) + 'px;';
        } else {
            seam.style.cssText  = 'left:' + (i * SLIDE_W) + 'px;top:0;width:0;height:100%;border-left:2px dashed rgba(20,20,20,0.2);';
            label.style.cssText = 'top:' + (SLIDE_H + 12) + 'px;left:' + (i + SLIDE_W / 2 - 22) + 'px;';
        }

        seam.appendChild(label);
        canvasTrack.appendChild(seam);
    }
}

applyLayout();
window.addEventListener('resize', applyLayout);

// ── Selection state ───────────────────────────────────────────────────────────
let activeWrapper = null;

canvasTrack.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.image-wrapper') && activeWrapper) {
        activeWrapper.classList.remove('active');
        activeWrapper = null;
    }
});

// ── Make wrapper draggable & resizable ────────────────────────────────────────
// Mobile scroll strategy:
//   • On pointerdown we do NOT preventDefault() — the browser may still scroll.
//   • We record the start position and enter 'pending' mode.
//   • On the first pointermove that exceeds DRAG_THRESHOLD we commit:
//       – add .is-dragging (sets touch-action:none on the element)
//       – call setPointerCapture() so all subsequent pointer events route here
//         and the browser stops scrolling for this touch.
//   • If the user lifts without exceeding the threshold it was a tap, not a drag.
function makeElementTransformable(wrapper) {
    const deleteBtn    = wrapper.querySelector('.delete-btn');
    const resizeHandle = wrapper.querySelector('.resize-handle');
    const img          = wrapper.querySelector('img');

    let gestureMode = null;  // null | 'pending' | 'drag' | 'resize'
    let capturedId  = null;
    let startCX, startCY, initLeft, initTop, initW, initH, ar;

    // Wrapper body → drag
    wrapper.addEventListener('pointerdown', (e) => {
        if (e.target === deleteBtn || e.target === resizeHandle) return;
        if (gestureMode) return;

        if (activeWrapper && activeWrapper !== wrapper)
            activeWrapper.classList.remove('active');
        activeWrapper = wrapper;
        wrapper.classList.add('active');

        gestureMode = 'pending';
        capturedId  = e.pointerId;
        startCX     = e.clientX;
        startCY     = e.clientY;
        initLeft    = parseFloat(wrapper.style.left) || 0;
        initTop     = parseFloat(wrapper.style.top)  || 0;
        // No preventDefault — let browser decide scroll vs drag for now
    });

    // Resize handle → always drag (never scroll)
    resizeHandle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (gestureMode) return;

        gestureMode = 'resize';
        capturedId  = e.pointerId;
        startCX     = e.clientX;
        startCY     = e.clientY;
        initW       = wrapper.offsetWidth;
        initH       = wrapper.offsetHeight;
        ar          = (img.naturalWidth / img.naturalHeight) || 1;

        wrapper.classList.add('is-dragging');
        resizeHandle.setPointerCapture(e.pointerId);
    });

    function onMove(e) {
        if (e.pointerId !== capturedId) return;

        if (gestureMode === 'pending') {
            const dx = e.clientX - startCX;
            const dy = e.clientY - startCY;
            if (Math.sqrt(dx * dx + dy * dy) < DRAG_THRESHOLD) return;

            // Threshold crossed — commit to drag
            gestureMode = 'drag';
            wrapper.classList.add('is-dragging');
            try { wrapper.setPointerCapture(e.pointerId); } catch (_) {}
            canvasTrack.appendChild(wrapper); // bring to front
        }

        if (gestureMode === 'drag') {
            let tx = initLeft + (e.clientX - startCX);
            let ty = initTop  + (e.clientY - startCY);

            wrapper.style.left = tx + 'px';
            wrapper.style.top  = ty + 'px';
        }

        if (gestureMode === 'resize') {
            const newW = Math.max(50, initW + (e.clientX - startCX));
            wrapper.style.width  = newW + 'px';
            wrapper.style.height = (newW / ar) + 'px';
        }
    }

    function onUp(e) {
        if (e.pointerId !== capturedId) return;
        gestureMode = null;
        capturedId  = null;
        wrapper.classList.remove('is-dragging');
    }

    wrapper.addEventListener('pointermove',   onMove);
    wrapper.addEventListener('pointerup',     onUp);
    wrapper.addEventListener('pointercancel', onUp);

    resizeHandle.addEventListener('pointermove',   onMove);
    resizeHandle.addEventListener('pointerup',     onUp);
    resizeHandle.addEventListener('pointercancel', onUp);

    deleteBtn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        wrapper.remove();
        if (activeWrapper === wrapper) activeWrapper = null;
    });
}

// ── Place image ────────────────────────────────────────────────────────────────
function placeImage(src, dropClientX, dropClientY) {
    const wrapper = document.createElement('div');
    wrapper.className = 'image-wrapper';

    const imgEl = document.createElement('img');
    imgEl.src = src;
    imgEl.style.cssText = 'width:100%;height:100%;display:block;pointer-events:none;';
    imgEl.setAttribute('draggable', 'false');

    const deleteBtn    = document.createElement('div');
    deleteBtn.className  = 'delete-btn';
    deleteBtn.innerHTML  = '&times;';

    const resizeHandle   = document.createElement('div');
    resizeHandle.className = 'resize-handle';

    wrapper.appendChild(imgEl);
    wrapper.appendChild(deleteBtn);
    wrapper.appendChild(resizeHandle);

    imgEl.onload = () => {
        const size = Math.min(Math.round(SLIDE_W * 0.5), 250);
        wrapper.style.width  = size + 'px';
        wrapper.style.height = size + 'px';

        let relLeft, relTop;
        if (dropClientX != null) {
            const rect = canvasTrack.getBoundingClientRect();
            relLeft = dropClientX - rect.left - size / 2;
            relTop  = dropClientY - rect.top  - size / 2;
        } else {
            relLeft = workspace.scrollLeft + workspace.clientWidth  / 2 - size / 2;
            relTop  = workspace.scrollTop  + workspace.clientHeight / 2 - size / 2;
        }

        wrapper.style.left = relLeft + 'px';
        wrapper.style.top  = relTop  + 'px';

        canvasTrack.appendChild(wrapper);
        makeElementTransformable(wrapper);
    };
}

// ── File picker ────────────────────────────────────────────────────────────────
addFileBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
    [...fileInput.files].forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = () => placeImage(reader.result, null, null);
    });
    fileInput.value = '';
});

// ── Desktop drag-and-drop ──────────────────────────────────────────────────────
['dragenter','dragover','dragleave','drop'].forEach(ev =>
    workspace.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); })
);
workspace.addEventListener('dragenter', () => dropOverlay.style.display = 'flex');
workspace.addEventListener('dragover',  () => dropOverlay.style.display = 'flex');
workspace.addEventListener('dragleave', (e) => {
    if (!e.relatedTarget || !workspace.contains(e.relatedTarget))
        dropOverlay.style.display = 'none';
});
workspace.addEventListener('drop', (e) => {
    dropOverlay.style.display = 'none';
    [...e.dataTransfer.files].forEach(file => {
        if (!file.type.startsWith('image/')) { alert('Images only!'); return; }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = () => placeImage(reader.result, e.clientX, e.clientY);
    });
});

// ── Export ─────────────────────────────────────────────────────────────────────
exportBtn.addEventListener('click', async () => {
    const OUT_W = 1080, OUT_H = 1350;
    const scaleX = OUT_W / SLIDE_W;
    const scaleY = OUT_H / SLIDE_H;

    const ctx = exportCanvas.getContext('2d');
    exportCanvas.width  = OUT_W;
    exportCanvas.height = OUT_H;

    const wrappers = document.querySelectorAll('.image-wrapper');
    const zip = new JSZip();

    // Update button to show progress
    const origLabel = exportBtn.textContent;
    exportBtn.disabled = true;

    for (let i = 0; i < TOTAL_SLIDES; i++) {
        exportBtn.textContent = (i + 1) + ' / ' + TOTAL_SLIDES;

        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, OUT_W, OUT_H);

        const winLeft = i * SLIDE_W;

        wrappers.forEach(w => {
            const el  = w.querySelector('img');
            const x   = w.offsetLeft, y  = w.offsetTop;
            const ww  = w.offsetWidth,  wh = w.offsetHeight;
            const fits = (x + ww > winLeft && x < winLeft + SLIDE_W);
            if (fits)
                ctx.drawImage(el, (x - winLeft) * scaleX, y * scaleY, ww * scaleX, wh * scaleY);
        });

        // Convert canvas to base64 and add to zip (strip the data:image/jpeg;base64, prefix)
        const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.95);
        const base64  = dataUrl.split(',')[1];
        zip.file('collageslice_' + (i + 1) + '.jpg', base64, { base64: true });

        // Yield to keep UI responsive
        await new Promise(r => setTimeout(r, 0));
    }

    exportBtn.textContent = 'Zipping...';
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    const link = document.createElement('a');
    link.download = 'carousel_export.zip';
    link.href = URL.createObjectURL(blob);
    link.click();
    URL.revokeObjectURL(link.href);

    exportBtn.textContent = origLabel;
    exportBtn.disabled = false;
});

// ── Portrait nav arrows ───────────────────────────────────────────────────────
const slideNav = document.getElementById('slide-nav');
const navPrev  = document.getElementById('nav-prev');
const navNext  = document.getElementById('nav-next');
const navLabel = document.getElementById('nav-label');
let currentSlide = 0;

function updateNavUI() {
    navLabel.textContent  = 'Slide ' + (currentSlide + 1) + ' / ' + TOTAL_SLIDES;
    navPrev.style.opacity = currentSlide === 0 ? '0.3' : '1';
    navNext.style.opacity = currentSlide === TOTAL_SLIDES - 1 ? '0.3' : '1';
}

function goToSlide(index) {
    currentSlide = Math.max(0, Math.min(TOTAL_SLIDES - 1, index));
    workspace.scrollTo({ left: currentSlide * SLIDE_W, behavior: 'smooth' });
    updateNavUI();
}

navPrev.addEventListener('click', () => goToSlide(currentSlide - 1));
navNext.addEventListener('click', () => goToSlide(currentSlide + 1));

// Use a media query so portrait detection matches CSS and is reliable on mobile
const portraitMQ = window.matchMedia('(orientation: portrait)');

function applyNavMode() {
    const portrait = portraitMQ.matches;
    if (portrait) {
        slideNav.style.display = 'flex';
        document.body.classList.add('portrait-mode');
        workspace.scrollLeft = currentSlide * SLIDE_W;
    } else {
        slideNav.style.display = 'none';
        document.body.classList.remove('portrait-mode');
    }
    updateNavUI();
}

// Replace the resize listener with one that also updates the nav
window.removeEventListener('resize', applyLayout);
window.addEventListener('resize', () => { applyLayout(); applyNavMode(); });

// Also fire on orientation change directly for instant response on mobile
portraitMQ.addEventListener('change', () => { applyLayout(); applyNavMode(); });

// Initial run
applyNavMode();

</script>
</body>
</html>
