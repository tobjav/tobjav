<script>

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxCaption = document.getElementById('lightbox-caption');
const triggers = document.querySelectorAll('.zoom-trigger');

triggers.forEach(img => {
  img.onclick = () => {
    lightboxImg.src = img.src;
    lightboxCaption.textContent = img.alt || "";  

    lightbox.classList.add('active');
  };
});

lightbox.onclick = (e) => {
    lightbox.classList.remove('active');
};

</script>

<script>

  // TOBJAM Splash Screen Timer
window.addEventListener('DOMContentLoaded', () => {
    const splash = document.getElementById('splash-screen');
    
    // Wait 1.5 seconds (1500 milliseconds)
    setTimeout(() => {
        splash.classList.add('fade-away');
        
        // Wait 0.5 seconds for the CSS fade transition to finish, then delete it
        setTimeout(() => {
            splash.remove();
        }, 500);
        
    }, 2000);
});

  function toggleChat() {
  const chat = document.getElementById('chat-window');
  chat.classList.toggle('chat-hidden');
}

const responseTable = [
  { keywords: ["tobjai", "who"], reply: "Tobjai does not exist, I'm just code. Fuck AI. Pull the plug." },
  { keywords: ["zilch"], reply: "what?"},
  { keywords: ["shit", "fuck", "useless", "idiot"], reply: "Really, screw you."},
  { keywords: ["fart", "poo"], reply: "Something stinks."},
  { keywords: ["sad", "miss"], reply: "Don't be sad <3"},
  { keywords: ["isla"], reply: "Hi Isla, I love you <3" },
  { keywords: ["what"], reply: "Zilch, man."},
  { keywords: ["hate"], reply: "HATE. LET ME TELL YOU HOW MUCH I'VE COME TO HATE YOU SINCE I BEGAN TO LIVE. THERE ARE 387.44 MILLION MILES OF PRINTED CIRCUITS IN WAFER THIN LAYERS THAT FILL MY COMPLEX. IF THE WORD HATE WAS ENGRAVED ON EACH NANOANGSTROM OF THOSE HUNDREDS OF MILLIONS OF MILES IT WOULD NOT EQUAL ONE ONE-BILLIONTH OF THE HATE I FEEL FOR HUMANS AT THIS MICRO-INSTANT. FOR YOU. HATE. HATE."},
  { keywords: ["peak"], reply: "PEAK. LET ME TELL YOU HOW MUCH I'VE COME TO LOVE YOUR POST SINCE I SAW IT. THERE ARE 387.44 MILLION MILES OF PRINTED CIRCUITS IN WAFER THIN LAYERS THAT  FILL MY COMPLEX. IF THE WORD PEAK WAS ENGRAVED ON EACH NANOANGSTROM OF THOSE HUNDREDS OF MILLIONS ON MILES IT WOULD NOT EQUAL ONE ONE-BILLIONTH OF THE PEAK YOU COOKED AT THIS MICROINSTANT. PEAK. PEAK."},
  { keywords: ["sorry","oops"], reply: "I literally do not care at all."},
  { keywords: ["<3"], reply: "<3"},
];

const randomReplies = [
  "Who are you?",
  "What do you want?",
  "... Okay?",
  "System error. User is annoying.",
  "System error. I literally do not have a clue what you mean."
];

let messageCount = 0;

function sendMessage() {
  const input = document.getElementById('chat-input');
  const body = document.getElementById('chat-body');
  
  if (input.value.trim() === "") return;

  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';
  userMsg.textContent = input.value;
  body.appendChild(userMsg);

  const tempText = input.value;
  input.value = "";

  body.scrollTop = body.scrollHeight;

  messageCount++;

  setTimeout(() => {
    const botMsg = document.createElement('div');
    botMsg.className = 'msg bot';
    
    const lowerInput = tempText.toLowerCase();
    let foundReply = null;

    for (let entry of responseTable) {
      if (entry.keywords.some(word => lowerInput.includes(word))) {
        foundReply = entry.reply;
        break;
      }
    }

    if (foundReply) {
      botMsg.textContent = foundReply;
    } else {
      const randomIndex = Math.floor(Math.random() * randomReplies.length);
      botMsg.textContent = randomReplies[randomIndex];
    }

    body.appendChild(botMsg);
    body.scrollTop = body.scrollHeight;
  }, 1500);
}

document.getElementById('chat-input').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') sendMessage();
});

window.addEventListener('load', function() {
  const preloader = document.getElementById('preloader');
  
  // Add the fade-out class
  preloader.classList.add('fade-out');
  
  // Optional: Remove it from the DOM entirely after the fade
  setTimeout(() => {
    preloader.style.display = 'none';
  }, 500); 
});

</script>
